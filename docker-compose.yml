version: "3.8"

# ============================================================
# RÉSEAU PARTAGÉ — permet à tous les services de se résoudre
# entre eux par leur nom (ex: minio:9000, postgres:5432)
# ============================================================
networks:
  data-platform-network:
    driver: bridge

# ============================================================
# VOLUMES PERSISTANTS
# ============================================================
volumes:
  postgres_data:
  minio_data:
  nifi_state:
  nifi_db:
  nifi_flowfile:
  nifi_content:
  nifi_provenance:
  spark_data:
  dremio_data:
  prometheus_data:
  grafana_data:

services:

  # ==========================================================
  # 1. POSTGRESQL — métadonnées Airflow + Nessie
  # ==========================================================
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AIRFLOW_DB: ${AIRFLOW_DB}
      NESSIE_DB: ${NESSIE_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-db.sh:/docker-entrypoint-initdb.d/init-multiple-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data-platform-network

  # ==========================================================
  # 2. MINIO — stockage objet S3-compatible (zone brute + warehouse)
  # ==========================================================
  minio:
    image: minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data-platform-network

  # ==========================================================
  # 3. NESSIE — catalogue versionné des tables Iceberg
  # ==========================================================
  nessie:
    image: ghcr.io/projectnessie/nessie:0.77.1
    container_name: nessie
    environment:
      QUARKUS_PROFILE: prod
      NESSIE_VERSION_STORE_TYPE: ${NESSIE_VERSION_STORE_TYPE}
      QUARKUS_DATASOURCE_JDBC_URL: ${NESSIE_JDBC_URL}
      QUARKUS_DATASOURCE_USERNAME: ${NESSIE_JDBC_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${NESSIE_JDBC_PASSWORD}
    ports:
      - "${NESSIE_PORT}:19120"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data-platform-network

  # ==========================================================
  # 4. SPARK MASTER — pilotage du cluster
  # ==========================================================
  spark-master:
    image: apache/spark:3.5.6-scala2.12-java17-python3-ubuntu
    container_name: spark-master
    environment:
      SPARK_NO_DAEMONIZE: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/opt/spark/sbin/start-master.sh"]
    command: ["--host", "spark-master"]
    ports:
      - "${SPARK_MASTER_UI_PORT}:8080"
      - "${SPARK_MASTER_PORT}:7077"
    volumes:
      - spark_data:/opt/spark/data
      - ./spark-jobs:/opt/spark/jobs
      - ./config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    networks:
      - data-platform-network

  # ==========================================================
# 5. SPARK WORKER — exécution des jobs
# ==========================================================
  spark-worker:
    image: apache/spark:3.5.6-scala2.12-java17-python3-ubuntu
    container_name: spark-worker
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_DIR: /tmp/spark-work
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/opt/spark/sbin/start-worker.sh"]
    command: ["spark://${SPARK_MASTER_HOST}:${SPARK_MASTER_PORT}"]
    ports:
      - "${SPARK_WORKER_UI_PORT}:8081"
    volumes:
      - ./spark-jobs:/opt/spark/jobs
      - ./config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    depends_on:
      - spark-master
    networks:
      - data-platform-network

   # ==========================================================
  # 6. DREMIO — moteur de requête SQL
  # ==========================================================
  dremio:
    image: dremio/dremio-oss:26.0.5
    container_name: dremio
    mem_limit: 4g
    ports:
      - "${DREMIO_UI_PORT}:9047"
      - "${DREMIO_COORD_PORT}:31010"
    volumes:
      - dremio_data:/opt/dremio/data
      - ./config/dremio-env:/opt/dremio/conf/dremio-env
    depends_on:
      - nessie
      - minio
    networks:
      - data-platform-network

    # ==========================================================
  # 7. AIRFLOW — orchestration du pipeline
  # ==========================================================
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username ${_AIRFLOW_WWW_USER_USERNAME} \
          --password ${_AIRFLOW_WWW_USER_PASSWORD} \
          --firstname admin --lastname admin \
          --role Admin --email admin@example.com
    networks:
      - data-platform-network
 
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-webserver
    depends_on:
      - airflow-init
    restart: on-failure
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
      AIRFLOW__WEBSERVER__RBAC: ${AIRFLOW__WEBSERVER__RBAC}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    ports:
      - "${AIRFLOW__WEBSERVER__WEB_SERVER_PORT}:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID}"
    command: webserver
    networks:
      - data-platform-network
 
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-scheduler
    depends_on:
      - airflow-init
    restart: on-failure
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID}"
    command: scheduler
    networks:
      - data-platform-network
 
  # ==========================================================
  # 8. NIFI — ingestion depuis FakeStoreAPI vers MinIO
  # ==========================================================
  nifi:
    image: apache/nifi:2.8.0
    container_name: nifi
    environment:
      NIFI_WEB_HTTP_PORT: ${NIFI_WEB_HTTP_PORT}
      NIFI_WEB_HTTPS_PORT: ${NIFI_WEB_HTTPS_PORT}
      NIFI_SENSITIVE_PROPS_KEY: ${NIFI_SENSITIVE_PROPS_KEY}
    ports:
      - "${NIFI_WEB_HTTP_PORT}:8080"
      - "${NIFI_WEB_HTTPS_PORT}:8443"
    volumes:
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_db:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - data-platform-network

    # ==========================================================
  # 9. PROMETHEUS — collecte des métriques NiFi (bonus supervision)
  # ==========================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/nifi_token.txt:/etc/prometheus/nifi_token.txt
      - prometheus_data:/prometheus
    networks:
      - data-platform-network
 
  # ==========================================================
  # 10. GRAFANA — visualisation des métriques (bonus supervision)
  # ==========================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - data-platform-network    