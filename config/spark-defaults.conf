# ============================================================
# SPARK DEFAULTS — accès MinIO (S3A) + catalogue Iceberg/Nessie
# ============================================================

# --- Cluster ---
spark.master                                   spark://spark-master:7077

# --- Cache Ivy ---
spark.jars.ivy                                 /tmp/.ivy2

# --- Région AWS requise par AWS SDK v2 utilisé par Iceberg S3FileIO ---
spark.driver.extraJavaOptions                 -Daws.region=us-east-1
spark.executor.extraJavaOptions               -Daws.region=us-east-1

# --- Accès S3A vers MinIO ---
spark.hadoop.fs.s3a.endpoint                   http://minio:9000
spark.hadoop.fs.s3a.access.key                 minioadmin
spark.hadoop.fs.s3a.secret.key                 minioadmin123
spark.hadoop.fs.s3a.path.style.access          true
spark.hadoop.fs.s3a.impl                       org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled     false

# --- AWS SDK / région pour MinIO ---
spark.sql.catalog.nessie.client.region         us-east-1
spark.sql.catalog.nessie.s3.region             us-east-1

# --- Extensions et packages nécessaires ---
spark.jars.packages                            org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.5.0,org.apache.iceberg:iceberg-aws-bundle:1.5.0,org.projectnessie.nessie-integrations:nessie-spark-extensions-3.5_2.12:0.77.1,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262

spark.sql.extensions                           org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,org.projectnessie.spark.extensions.NessieSparkSessionExtensions

# --- Catalogue Iceberg "nessie" ---
spark.sql.catalog.nessie                     org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.nessie.catalog-impl        org.apache.iceberg.nessie.NessieCatalog
spark.sql.catalog.nessie.uri                 http://nessie:19120/api/v2
spark.sql.catalog.nessie.ref                 main
spark.sql.catalog.nessie.warehouse           s3a://warehouse/
spark.sql.catalog.nessie.io-impl             org.apache.iceberg.aws.s3.S3FileIO

# --- MinIO / AWS SDK v2 ---
spark.sql.catalog.nessie.client.region       us-east-1
spark.sql.catalog.nessie.s3.region           us-east-1
spark.sql.catalog.nessie.s3.endpoint         http://minio:9000
spark.sql.catalog.nessie.s3.path-style-access true
spark.sql.catalog.nessie.s3.access-key-id    minioadmin
spark.sql.catalog.nessie.s3.secret-access-key minioadmin123
# --- Catalogue par défaut ---
spark.sql.defaultCatalog                       nessie